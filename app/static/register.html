<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작업대장 · HAAR Workspace</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/register.css"><script src="/register.js" defer></script></head>
<body><header class="register-header"><a href="/">HAAR Workspace</a><span>중앙 작업대장</span><button id="refresh-register" class="secondary">확인본 새로고침</button></header>
<main class="register-main"><h1>중앙 작업대장</h1><p class="register-intro">Library 원본 상태를 확인하고 변경을 제안합니다.</p>
<section class="register-source" aria-labelledby="source-title"><h2 id="source-title">원본 연결 상태</h2><p id="source-status" role="status">확인본을 읽고 있습니다.</p><p class="source-boundary">60초마다 VPS 확인본 조회 · Library 상시 수집 미연결</p><details><summary>원본 ID·해시와 연결 범위</summary><dl id="source-details"></dl><p>Library의 실시간 변경 여부는 미확인입니다. 권한 있는 Library 소비자의 가져오기가 필요합니다. 화면 조회는 작업의 마지막 확인 시각을 갱신하지 않습니다. 화면 변경은 반영 대기 제안이며 실제 작업을 시작하거나 중지하지 않습니다.</p></details></section>
<p id="register-error" class="register-error" role="alert" hidden></p><p id="register-notice" role="status"></p><p id="register-priorities"></p>
<section class="register-toolbar"><label>상태 필터<select id="status-filter"><option value="">전체</option></select></label><p id="register-count"></p></section>
<div id="register-tasks"></div><section class="register-history"><h2>연동·변경 기록</h2><ol id="register-events"></ol></section></main></body></html>
